<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Lịch Dạy</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 600px; margin: auto; }
        .hidden { display: none; }
        input, select, button { padding: 10px; font-size: 16px; margin-top: 5px; margin-bottom: 15px; width: 100%; box-sizing: border-box; }
        .form-group { margin-bottom: 10px; }
        #login-section { background: #f0f0f0; padding: 20px; border-radius: 5px; }
        .error { color: red; }
        .success { color: green; font-weight: bold; }
    </style>
</head>
<body>

    <!-- PHẦN 1: ĐĂNG NHẬP -->
    <div id="login-section">
        <h2>Đăng Nhập Giáo Viên</h2>
        <input type="email" id="email" placeholder="Email">
        <input type="password" id="password" placeholder="Mật khẩu">
        <button id="btnLogin">Đăng nhập</button>
        <p id="login-msg" class="error"></p>
    </div>

    <!-- PHẦN 2: FORM THÊM LỊCH (Ẩn lúc đầu) -->
    <div id="admin-section" class="hidden">
        <h2>Thêm Lịch Dạy Mới</h2>
        <p>Xin chào, <strong id="user-email"></strong>! <button id="btnLogout" style="width: auto; padding: 5px 10px; margin-left:10px;">Đăng xuất</button></p>
        
        <div class="form-group">
            <label>Chọn giáo viên:</label>
            <select id="teacherSelect"></select>
        </div>
        
        <div class="form-group">
            <label>Lớp học:</label>
            <input type="text" id="classId" placeholder="Ví dụ: Lớp 6A">
        </div>

        <div class="form-group">
            <label>Phòng học:</label>
            <input type="text" id="room" placeholder="Ví dụ: P.101">
        </div>

        <div class="form-group">
            <label>Thứ (2 - 8):</label>
            <input type="number" id="dayOfWeek" min="2" max="8" placeholder="Ví dụ: 2">
        </div>

        <div class="form-group">
            <label>Giờ bắt đầu:</label>
            <input type="time" id="startTime">
        </div>

        <div class="form-group">
            <label>Giờ kết thúc:</label>
            <input type="time" id="endTime">
        </div>

        <button id="btnSave" style="background-color: #4CAF50; color: white; border: none; cursor: pointer;">Lưu Lịch Dạy</button>
        <p id="save-msg"></p>
    </div>

    <!-- Import Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // DÁN CẤU HÌNH CỦA BẠN VÀO ĐÂY
        const firebaseConfig = {
            apiKey: "AIzaSyCFTpGS3B2XrMDqLSLMEKopHlpuBWGzPD8",
            authDomain: "lich-day-trung-tam-av.firebaseapp.com",
            projectId: "lich-day-trung-tam-av",
            storageBucket: "lich-day-trung-tam-av.firebasestorage.app",
            messagingSenderId: "441046477478",
            appId: "1:441046477478:web:c10e07e589447ae76b2267",
            measurementId: "G-XWR1KP7CV3"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        // Lấy các element
        const loginSection = document.getElementById('login-section');
        const adminSection = document.getElementById('admin-section');
        const emailInput = document.getElementById('email');
        const passInput = document.getElementById('password');
        const btnLogin = document.getElementById('btnLogin');
        const loginMsg = document.getElementById('login-msg');
        const btnLogout = document.getElementById('btnLogout');
        const userEmail = document.getElementById('user-email');
        const teacherSelect = document.getElementById('teacherSelect');
        const btnSave = document.getElementById('btnSave');
        const saveMsg = document.getElementById('save-msg');

        // 1. XỬ LÝ ĐĂNG NHẬP
        btnLogin.addEventListener('click', () => {
            const email = emailInput.value;
            const pass = passInput.value;
            loginMsg.textContent = "Đang đăng nhập...";
            
            signInWithEmailAndPassword(auth, email, pass)
                .then(() => {
                    loginMsg.textContent = "";
                })
                .catch((error) => {
                    loginMsg.textContent = "Lỗi: " + error.message;
                });
        });

        // 2. XỬ LÝ ĐĂNG XUẤT
        btnLogout.addEventListener('click', () => {
            signOut(auth);
        });

        // 3. THEO DÕI TRẠNG THÁI ĐĂNG NHẬP
        onAuthStateChanged(auth, (user) => {
            if (user) {
                // Đã đăng nhập
                loginSection.classList.add('hidden');
                adminSection.classList.remove('hidden');
                userEmail.textContent = user.email;
                loadTeachers(); // Tải danh sách giáo viên vào form
            } else {
                // Chưa đăng nhập
                loginSection.classList.remove('hidden');
                adminSection.classList.add('hidden');
                emailInput.value = '';
                passInput.value = '';
            }
        });

        // 4. HÀM TẢI GIÁO VIÊN VÀO THẺ SELECT
        async function loadTeachers() {
            const querySnapshot = await getDocs(collection(db, "teachers"));
            teacherSelect.innerHTML = '<option value="">-- Chọn giáo viên --</option>';
            querySnapshot.forEach((doc) => {
                const data = doc.data();
                const option = document.createElement('option');
                option.value = data.teacherId;
                option.textContent = data.name;
                teacherSelect.appendChild(option);
            });
        }

        // 5. XỬ LÝ LƯU LỊCH DẠY
        btnSave.addEventListener('click', async () => {
            const teacherId = teacherSelect.value;
            const classId = document.getElementById('classId').value;
            const room = document.getElementById('room').value;
            const dayOfWeek = Number(document.getElementById('dayOfWeek').value);
            const startTime = document.getElementById('startTime').value;
            const endTime = document.getElementById('endTime').value;

            if (!teacherId || !classId || !room || !dayOfWeek || !startTime || !endTime) {
                saveMsg.textContent = "Vui lòng nhập đầy đủ thông tin!";
                saveMsg.className = "error";
                return;
            }

            saveMsg.textContent = "Đang lưu...";
            saveMsg.className = "";

            try {
                // Lưu vào Firestore
                await addDoc(collection(db, "schedules"), {
                    teacherId: teacherId,
                    classId: classId,
                    room: room,
                    dayOfWeek: dayOfWeek,
                    startTime: startTime,
                    endTime: endTime,
                    updatedAt: new Date()
                });
                
                saveMsg.textContent = "Lưu thành công!";
                saveMsg.className = "success";
                
                // Xóa trắng form
                document.getElementById('classId').value = '';
                document.getElementById('room').value = '';
                document.getElementById('dayOfWeek').value = '';
                document.getElementById('startTime').value = '';
                document.getElementById('endTime').value = '';
                
            } catch (error) {
                console.error(error);
                saveMsg.textContent = "Lỗi khi lưu: " + error.message;
                saveMsg.className = "error";
            }
        });
    </script>
</body>
</html>
